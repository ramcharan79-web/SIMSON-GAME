<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
    <title>Simon Game</title>
</head>

<body>
    <div class="wrapper">
        <h1>SIMON GAME</h1>
        <h3>Press any key to start the game</h3>
        <div class="main">
            <div class="row1">
                <div class="red btn" type="button" id="red">1</div>
                <div class="green btn" type="button" id="green">2</div>
            </div>
            <!-- <div id="start">START</div> -->
            <div class="row2">
                <div class="orange btn" type="button" id="orange">3</div>
                <div class="purple btn" type="button" id="purple">4</div>
            </div>
        </div>
    </div>
  <script src="./simon.js"></script>
</body>

</html>
